name: Generate metrics calendar

on:
  schedule:
    - cron: "37 20 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Full-year isometric calendar with streaks
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.isocalendar.svg
          committer_branch: metrics
          committer_message: "chore: update metrics calendar"
          base: ""
          config_timezone: Asia/Shanghai
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Check out the metrics branch
        uses: actions/checkout@v4
        with:
          ref: metrics

      - name: Make a dark-theme copy
        run: |
          sed -e 's/#ebedf0/#2d333b/g' -e 's/#9be9a8/#0e4429/g' -e 's/#40c463/#006d32/g' \
              -e 's/#30a14e/#26a641/g' -e 's/#216e39/#39d353/g' \
              metrics.isocalendar.svg > metrics.isocalendar.dark.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.isocalendar.dark.svg
          git diff --cached --quiet || git commit -m "chore: update dark metrics calendar"
          git push origin metrics
